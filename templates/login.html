{% extends "base.html" %}
{% block title %}Login - Task Manager{% endblock %}
{% block content %}
<div style="max-width: 380px; margin: 60px auto;">
  <div class="card" style="text-align: center;">
    {% if app_logo_url %}<img src="{{ app_logo_url }}" alt="Logo" style="max-height: 48px; margin-bottom: 12px;">{% endif %}
    <h1 style="margin-bottom: 4px;">{{ app_name }}</h1>
    <p style="color: var(--text-light); margin-bottom: 24px;">Sign in to continue</p>
    <form method="POST" action="/login">
      <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
      <div class="form-group" style="margin-bottom: 12px; text-align: left;">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" required autofocus>
      </div>
      <div class="form-group" style="margin-bottom: 20px; text-align: left;">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px;">Sign In</button>
    </form>
  </div>
</div>
{% endblock %}
