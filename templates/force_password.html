{% extends "base.html" %}
{% block title %}Change Password - {{ app_name }}{% endblock %}
{% block content %}
<div style="max-width: 380px; margin: 60px auto;">
  <div class="card" style="text-align: center;">
    <h1 style="margin-bottom: 4px;">Change Your Password</h1>
    <p style="color: var(--text-light); margin-bottom: 24px;">You must change your password before continuing.</p>
    <form method="POST" action="/force-change-password">
      <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
      <div class="form-group" style="margin-bottom: 12px; text-align: left;">
        <label>New Password</label>
        <input type="password" name="new_password" placeholder="Min 4 characters" required minlength="4" autofocus>
      </div>
      <div class="form-group" style="margin-bottom: 20px; text-align: left;">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" placeholder="Re-enter password" required minlength="4">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px;">Set New Password</button>
    </form>
  </div>
</div>
{% endblock %}
